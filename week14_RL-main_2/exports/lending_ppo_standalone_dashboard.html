    const tour = graph.tour || [];

    const colors = {
      file: "#38bdf8",
      class: "#a78bfa",
      concept: "#34d399",
      document: "#fbbf24",
      config: "#fb923c",
      function: "#fb7185",
      module: "#22d3ee"
    };

    const nodeById = new Map(nodes.map(n => [n.id, n]));
    const layerByNode = new Map();
    layers.forEach(layer => (layer.nodeIds || []).forEach(id => layerByNode.set(id, layer)));

    let selectedId = nodes[0]?.id || null;
    let activeLayer = "all";
    let query = "";

    function layerIndex(id) {
      const layer = layerByNode.get(id);
      const index = layers.findIndex(l => l.id === layer?.id);
      return index >= 0 ? index : layers.length;
    }

    function computeLayout() {
      const grouped = new Map();
      nodes.forEach(n => {
        const li = layerIndex(n.id);
        if (!grouped.has(li)) grouped.set(li, []);
        grouped.get(li).push(n);
      });
      const width = 1200;
      const height = 820;
      const columns = Math.max(1, Math.min(4, Math.ceil(Math.sqrt(layers.length + 1))));
      const colWidth = width / columns;
      const rows = Math.ceil((layers.length + 1) / columns);
      const rowHeight = height / rows;
      const positions = new Map();

      Array.from(grouped.keys()).sort((a, b) => a - b).forEach(li => {
        const group = grouped.get(li);
        const col = li % columns;
        const row = Math.floor(li / columns);
        const cx = col * colWidth + colWidth / 2;
        const cy = row * rowHeight + rowHeight / 2;
        const radiusX = Math.max(80, colWidth * 0.32);
        const radiusY = Math.max(58, rowHeight * 0.28);
        group.forEach((n, i) => {
          const angle = group.length === 1 ? 0 : (Math.PI * 2 * i) / group.length - Math.PI / 2;
          positions.set(n.id, {
            x: cx + Math.cos(angle) * radiusX,
            y: cy + Math.sin(angle) * radiusY,
            w: nodeWidth(n),
            h: 48
          });
        });
      });
      return positions;
    }

    function nodeWidth(n) {
      return Math.max(130, Math.min(230, 52 + String(n.name || n.id).length * 7));
    }

    const positions = computeLayout();

    function matches(n) {
      const text = [n.id, n.name, n.type, n.summary, ...(n.tags || [])].join(" ").toLowerCase();
      const byQuery = !query || text.includes(query.toLowerCase());
      const byLayer = activeLayer === "all" || layerByNode.get(n.id)?.id === activeLayer;
      return byQuery && byLayer;
    }

    function connectedToSelected(edge) {
      return edge.source === selectedId || edge.target === selectedId;
    }

    function render() {
      document.getElementById("project-title").textContent = graph.project?.name || "Knowledge Graph";
      document.getElementById("project-description").textContent = graph.project?.description || "";
      document.getElementById("stat-nodes").textContent = nodes.length;
      document.getElementById("stat-edges").textContent = edges.length;
      document.getElementById("stat-layers").textContent = layers.length;
      document.getElementById("stat-tour").textContent = tour.length;

      renderLayers();
      renderTour();
      renderLegend();
      renderGraph();
      renderDetails();
      const visible = nodes.filter(matches).length;
      document.getElementById("status").textContent = `${visible} / ${nodes.length} nodes visible`;
    }

    function renderLayers() {
      const el = document.getElementById("layers");
      el.innerHTML = "";
      const all = document.createElement("button");
      all.textContent = "All layers";
      all.className = activeLayer === "all" ? "active" : "";
      all.onclick = () => { activeLayer = "all"; render(); };
      el.appendChild(all);
      layers.forEach(layer => {
        const btn = document.createElement("button");
        btn.textContent = `${layer.name} (${(layer.nodeIds || []).length})`;
        btn.className = activeLayer === layer.id ? "active" : "";
        btn.onclick = () => { activeLayer = layer.id; render(); };
        el.appendChild(btn);
      });
    }

    function renderTour() {
      const el = document.getElementById("tour");
      el.innerHTML = "";
      tour.forEach(step => {
        const btn = document.createElement("button");
        btn.textContent = `${step.order}. ${step.title}`;
        btn.onclick = () => {
          selectedId = step.nodeIds?.[0] || selectedId;
          activeLayer = "all";
          query = "";
          document.getElementById("search").value = "";
          render();
        };
        el.appendChild(btn);
      });
    }

    function renderLegend() {
      const el = document.getElementById("legend");
      el.innerHTML = "";
      Object.entries(colors).forEach(([type, color]) => {
        if (!nodes.some(n => n.type === type)) return;
        const row = document.createElement("div");
        row.className = "legend-row";
        row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${type}</span>`;
        el.appendChild(row);
      });
    }

    function renderGraph() {
      const svg = document.getElementById("graph");
      svg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path>
          </marker>
          <marker id="arrow-highlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"></path>
          </marker>
        </defs>
      `;
      const edgeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.append(edgeLayer, nodeLayer);

      edges.forEach(e => {
        const s = positions.get(e.source);
        const t = positions.get(e.target);
        if (!s || !t) return;
        const sourceVisible = matches(nodeById.get(e.source));
        const targetVisible = matches(nodeById.get(e.target));
        if (!sourceVisible || !targetVisible) return;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const midX = (s.x + t.x) / 2;
        const d = `M ${s.x} ${s.y} C ${midX} ${s.y}, ${midX} ${t.y}, ${t.x} ${t.y}`;
        line.setAttribute("d", d);
        line.setAttribute("class", `edge ${connectedToSelected(e) ? "highlight" : ""}`);
        line.setAttribute("marker-end", connectedToSelected(e) ? "url(#arrow-highlight)" : "url(#arrow)");
        edgeLayer.appendChild(line);
      });

      nodes.forEach(n => {
        const p = positions.get(n.id);
        if (!p) return;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const visible = matches(n);
        g.setAttribute("class", `node ${visible ? "" : "dim"} ${n.id === selectedId ? "selected" : ""}`);
        g.setAttribute("transform", `translate(${p.x - p.w / 2}, ${p.y - p.h / 2})`);
        g.onclick = () => { selectedId = n.id; render(); };
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("width", p.w);
        rect.setAttribute("height", p.h);
        rect.setAttribute("fill", colors[n.type] || "#64748b");
        g.appendChild(rect);

        const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
        title.setAttribute("x", 12);
        title.setAttribute("y", 20);
        title.textContent = truncate(n.name || n.id, 24);
        g.appendChild(title);

        const type = document.createElementNS("http://www.w3.org/2000/svg", "text");
        type.setAttribute("x", 12);
        type.setAttribute("y", 38);
        type.setAttribute("class", "type");
        type.textContent = `${n.type} · ${n.complexity}`;
        g.appendChild(type);
        nodeLayer.appendChild(g);
      });
    }

    function truncate(value, max) {
      value = String(value);
      return value.length > max ? value.slice(0, max - 1) + "…" : value;
    }

    function renderDetails() {
      const el = document.getElementById("details");
      const n = nodeById.get(selectedId);
      if (!n) {
        el.innerHTML = `<p class="empty">Click a node to inspect it.</p>`;
        return;
      }
      const incoming = edges.filter(e => e.target === n.id);
      const outgoing = edges.filter(e => e.source === n.id);
      el.innerHTML = `
        <div class="detail-title">${escapeHtml(n.name || n.id)}</div>
        <div class="muted"><code>${escapeHtml(n.id)}</code></div>
        <div class="badge-row">
          <span class="badge">${escapeHtml(n.type)}</span>
          <span class="badge">${escapeHtml(n.complexity || "moderate")}</span>
          ${(n.tags || []).map(t => `<span class="badge">${escapeHtml(t)}</span>`).join("")}
        </div>
        <p>${escapeHtml(n.summary || "")}</p>
        ${n.filePath ? `<p>File: <code>${escapeHtml(n.filePath)}</code></p>` : ""}
        <h2>Outgoing</h2>
        ${outgoing.length ? outgoing.map(relationHtml).join("") : `<p class="empty">No outgoing edges.</p>`}
        <h2>Incoming</h2>
        ${incoming.length ? incoming.map(relationHtml).join("") : `<p class="empty">No incoming edges.</p>`}
      `;
    }

    function relationHtml(e) {
      const other = nodeById.get(e.source === selectedId ? e.target : e.source);
      return `<div class="relation"><strong>${escapeHtml(e.type)}</strong> ${escapeHtml(e.direction || "forward")}<br>${escapeHtml(other?.name || other?.id || "")}<br><span>${escapeHtml(e.description || "")}</span></div>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("search").addEventListener("input", event => {
      query = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
