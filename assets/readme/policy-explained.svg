<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Policy explained: one borrower segment per token, cross-segment attention, allocation heads, and PPO training</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536777"/></marker><marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94631A"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="55" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#172B3A" font-weight="700" text-anchor="start">2. How the Transformer makes an allocation</text><text x="55" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#536777" font-weight="400" text-anchor="start">Attention compares borrower groups within a month. PPO learns from outcomes across months.</text><text x="55" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#176F96" font-weight="700" text-anchor="start">BUILD ONE TOKEN PER SEGMENT</text><rect x="55" y="185" width="1330" height="164" rx="14" fill="#EAF4FA" /><text x="80" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#176F96" font-weight="700" text-anchor="start">One segment token</text><text x="80" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172B3A" font-weight="400" text-anchor="start">Bank context (16)  +  its demand (1)  +  its loan balances (6)  +  its parameters (6)</text><text x="80" y="310.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">= 29 features per token. Repeat for all 30 segments; bank context is shared.</text><text x="55" y="391.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#167664" font-weight="700" text-anchor="start">COMPARE THE 30 SEGMENTS</text><rect x="55" y="418" width="300" height="155" rx="14" fill="#EAF4FA" /><text x="77" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#176F96" font-weight="700" text-anchor="start">30 tokens</text><text x="77" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Project to 384 features</text><text x="77" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Add segment identity</text><rect x="430" y="418" width="480" height="155" rx="14" fill="#E9F5F0" /><text x="452" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#167664" font-weight="700" text-anchor="start">Transformer encoder</text><text x="452" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">Each segment attends to other segments</text><text x="452" y="530.64" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">to compare risk, demand, and exposure.</text><text x="452" y="563.28" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">3 layers · 4 attention heads</text><rect x="985" y="418" width="400" height="155" rx="14" fill="#EAF4FA" /><text x="1007" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#176F96" font-weight="700" text-anchor="start">Context-aware features</text><text x="1007" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">30 segment representations</text><text x="1007" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">plus a pooled bank summary</text><path d="M367,495 L416,495" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M922,495 L971,495" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="618.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#167664" font-weight="700" text-anchor="start">TURN REPRESENTATIONS INTO A DECISION</text><rect x="55" y="649" width="405" height="138" rx="14" fill="#E9F5F0" /><text x="77" y="689.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#167664" font-weight="700" text-anchor="start">Allocation priority head</text><text x="77" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">30 scores: where to lend</text><text x="77" y="761.64" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">Different from borrower risk scores</text><rect x="505" y="649" width="405" height="138" rx="14" fill="#E9F5F0" /><text x="527" y="689.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#167664" font-weight="700" text-anchor="start">Deployment head</text><text x="527" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">1 scalar: how much to lend</text><text x="527" y="761.64" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">Uses pooled features + bank context</text><rect x="955" y="649" width="430" height="138" rx="14" fill="#FBF2DF" /><text x="977" y="689.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#94631A" font-weight="700" text-anchor="start">Critic V(s)</text><text x="977" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">Estimates future return for learning</text><text x="977" y="761.64" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">Uses pooled features + bank context</text><text x="55" y="825.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#167664" font-weight="700" text-anchor="start">31 actor outputs</text><path d="M294,816 L355,816" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><text x="374" y="825.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172B3A" font-weight="400" text-anchor="start">Reserve / demand constraints</text><path d="M756,816 L817,816" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><text x="837" y="825.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#167664" font-weight="700" text-anchor="start">30 lending amounts</text><line x1="55" y1="860" x2="1385" y2="860" stroke="#CBD5DD" stroke-width="2"/><text x="55" y="911.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#94631A" font-weight="700" text-anchor="start">PPO TRAINING</text><text x="55" y="956.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">Rollouts + rewards</text><path d="M315,948 L372,948" fill="none" stroke="#94631A" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#train)"/><text x="391" y="956.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">Advantages using V(s)</text><path d="M698,948 L755,948" fill="none" stroke="#94631A" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#train)"/><text x="776" y="956.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">Update Transformer + heads</text><text x="55" y="1010.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Primal-dual penalty targets liquidation ≤ 3%; soft LCR / CAR penalties warn before failure.</text><text x="55" y="1049.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">The critic supports training. Actor outputs drive the lending decision.</text></svg>