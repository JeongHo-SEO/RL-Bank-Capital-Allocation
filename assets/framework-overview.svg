<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img"><title>Framework overview: risk prediction, borrower segments, and the monthly allocation loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#536777"/></marker><marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94631A"/></marker></defs><rect width="1440" height="940" fill="white"/><text x="55" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#172B3A" font-weight="700" text-anchor="start">1. From loan records to monthly lending decisions</text><text x="55" y="103.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#536777" font-weight="400" text-anchor="start">Two learning tasks: predict borrower default risk, then learn monthly bank-level allocation.</text><text x="55" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#176F96" font-weight="700" text-anchor="start">PREPARATION  ·  Historical data calibrates the environment</text><rect x="55" y="185" width="300" height="170" rx="14" fill="#F2F5F7" /><text x="77" y="225.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">Loan records</text><text x="77" y="265.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Borrower features</text><text x="77" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Loan outcomes</text><text x="77" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Lending Club data</text><rect x="410" y="185" width="300" height="170" rx="14" fill="#EAF4FA" /><text x="432" y="225.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#176F96" font-weight="700" text-anchor="start">Risk score (LR)</text><text x="432" y="265.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Features → P(default)</text><text x="432" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">One score per borrower</text><text x="432" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Logistic Regression</text><rect x="765" y="185" width="300" height="170" rx="14" fill="#EAF4FA" /><text x="787" y="225.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#176F96" font-weight="700" text-anchor="start">30 segments</text><text x="787" y="265.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">5 risk buckets</text><text x="787" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">× 3 loan-size tiers</text><text x="787" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">× 2 loan terms</text><rect x="1120" y="185" width="265" height="170" rx="14" fill="#F2F5F7" /><text x="1142" y="225.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">Calibration</text><text x="1142" y="265.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Empirical bad rates</text><text x="1142" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Interest / recovery</text><text x="1142" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Monthly demand</text><path d="M363,270 L398,270" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M718,270 L753,270" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M1073,270 L1108,270" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Risk score defines the risk bucket. Combine it with loan size and term to form 30 borrower groups.</text><line x1="55" y1="433" x2="1385" y2="433" stroke="#CBD5DD" stroke-width="2"/><text x="55" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#167664" font-weight="700" text-anchor="start">MONTHLY DECISION  ·  Repeat for 36 months</text><rect x="55" y="515" width="300" height="180" rx="14" fill="#F2F5F7" /><text x="77" y="555.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">1  Observe the bank</text><text x="77" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Cash and capital</text><text x="77" y="629.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">New demand</text><text x="77" y="663.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Existing loan balances</text><rect x="410" y="515" width="300" height="180" rx="14" fill="#E9F5F0" /><text x="432" y="555.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#167664" font-weight="700" text-anchor="start">2  Choose allocation</text><text x="432" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Transformer policy</text><text x="432" y="629.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">How much to lend?</text><text x="432" y="663.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Which segments?</text><rect x="765" y="515" width="300" height="180" rx="14" fill="#E9F5F0" /><text x="787" y="555.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#167664" font-weight="700" text-anchor="start">3  Apply constraints</text><text x="787" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Keep cash reserves</text><text x="787" y="629.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Respect loan demand</text><text x="787" y="663.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">30 lending amounts</text><rect x="1120" y="515" width="265" height="180" rx="14" fill="#F2F5F7" /><text x="1142" y="555.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start">4  Simulate</text><text x="1142" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Repayments</text><text x="1142" y="629.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Defaults / shocks</text><text x="1142" y="663.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="start">Profit / liquidation</text><path d="M363,605 L398,605" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M718,605 L753,605" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M1073,605 L1108,605" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M1250,355 L1410,355 L1410,490 L1250,490 L1250,507" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><path d="M1250,704 L1250,755 L205,755 L205,704" fill="none" stroke="#536777" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="741.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#536777" font-weight="400" text-anchor="middle">Next month: updated cash, outstanding loans, demand, and risk</text><rect x="55" y="810" width="1330" height="86" rx="14" fill="#FBF2DF" /><text x="78" y="845.0" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#94631A" font-weight="700" text-anchor="start">Logistic Regression learns from default labels. PPO learns from simulated rewards.</text><text x="78" y="878.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#536777" font-weight="400" text-anchor="start">After the decision horizon, existing loans run off for up to 60 months; no new lending is added.</text></svg>